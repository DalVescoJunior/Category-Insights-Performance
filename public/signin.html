<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Category Insights &amp; Performance</title>
<link rel="icon" href="/brand/aramtec-logo.png">
<style>
:root { --brand-blue: #2a3879; --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f9fafb; --border: #dfe2e8; --text: #1b1f2a; --text-muted: #5b6070; --short: #b3261e; --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08); color-scheme: light; }
/* always light, as in Executive Pulse */
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; background: var(--bg); color: var(--text); }
.signin { min-height: 100vh; display: grid; place-items: center; padding: 24px 0; }
.signin-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 36px 48px; width: min(560px, calc(100vw - 32px)); box-shadow: var(--shadow); overflow: hidden; }
.signin-brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px; }
.signin-brand img { width: 230px; height: auto; }
.signin-band { align-self: stretch; margin: 24px -48px 0; padding: 22px 16px 24px; background: var(--brand-blue); color: #fff; }
h1 { font-size: 30px; line-height: 1.2; letter-spacing: -0.01em; color: #fff; margin: 0 0 8px; }
.tagline { margin: 0; font-size: 16px; font-weight: 500; line-height: 1.4; color: #a6d77a; }
label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; }
input { font: inherit; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }
input:focus-visible, .btn:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
.muted { color: var(--text-muted); }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.btn { font: inherit; font-size: 15px; width: 100%; text-align: left; padding: 11px 18px; border-radius: 8px; align-items: center; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.btn:hover { background: var(--surface-2); border-color: var(--brand-blue); }
.btn small { color: var(--text-muted); font-size: 12.5px; }
.error { color: var(--short); font-weight: 600; }
@media (max-width: 520px) { h1 { font-size: 22px; } .tagline { font-size: 13px; } .signin-card { padding: 24px; } .signin-band { margin: 20px -24px 0; } .signin-brand img { width: 170px; } }
</style>
</head>
<body>
<main class="signin">
  <div class="signin-card">
    <div class="signin-brand">
      <img src="/brand/aramtec-logo.png" alt="Aramtec, a food service company" width="230" height="146">
      <div class="signin-band">
        <h1>Category Insights &amp; Performance</h1>
        <p class="tagline">Measure results. Find opportunities. Improve performance.</p>
      </div>
    </div>
    <!--ERROR-->
    <form method="post" action="/api/auth/demo">
      <!--CODE-->
      <p class="muted">Demo mode with synthetic data. Choose a demo user:</p>
      <ul>
        <!--USERS-->
      </ul>
    </form>
  </div>
</main>
</body>
</html>
