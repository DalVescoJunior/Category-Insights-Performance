<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Category Insights &amp; Performance</title>
<link rel="icon" href="/brand/aramtec-logo.png">
<style>
:root { --brand-blue: #2a3879; --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f9fafb; --border: #dfe2e8; --text: #1b1f2a; --text-muted: #5b6070; --short: #b3261e; --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08); color-scheme: light; }
/* dark mode follows the theme chosen inside the app; the navy band and the white logo stay as in Executive Pulse */
:root[data-theme="dark"] { --bg: #12151c; --surface: #1b1f29; --surface-2: #222734; --border: #323848; --text: #e8eaf0; --text-muted: #a3a9b8; --short: #ff8a80; --brand-blue-hover: #9fb0ff; color-scheme: dark; }
:root[data-theme="dark"] .signin-brand { background: var(--brand-blue); margin: -32px -32px 20px; padding-top: 28px; }
:root[data-theme="dark"] .signin-band { margin-top: 12px; }
.logo-dark { display: none; }
:root[data-theme="dark"] .logo-light { display: none; }
:root[data-theme="dark"] .logo-dark { display: inline; }
:root[data-theme="dark"] .btn:hover { border-color: var(--brand-blue-hover); }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; background: var(--bg); color: var(--text); }
.signin { min-height: 100vh; display: grid; place-items: center; padding: 24px 0; }
.signin-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; width: min(420px, calc(100vw - 32px)); box-shadow: var(--shadow); overflow: hidden; }
.signin-brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 20px; }
.signin-band { align-self: stretch; margin: 20px -32px 0; padding: 16px 16px 18px; background: var(--brand-blue); color: #fff; }
h1 { font-size: 23px; line-height: 1.25; letter-spacing: -0.01em; color: #fff; margin: 0 0 8px; }
.tagline { margin: 0; font-size: 13.5px; font-weight: 500; line-height: 1.4; color: #a6d77a; }
label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; }
input { font: inherit; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }
input:focus-visible, .btn:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
.muted { color: var(--text-muted); }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.btn { font: inherit; font-size: 13px; width: 100%; text-align: left; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.btn:hover { background: var(--surface-2); border-color: var(--brand-blue); }
.btn small { color: var(--text-muted); font-size: 12px; }
.error { color: var(--short); font-weight: 600; }
@media (max-width: 420px) { h1 { font-size: 20px; } .tagline { font-size: 12px; } .signin-card { padding: 24px; } .signin-band { margin: 20px -24px 0; } :root[data-theme="dark"] .signin-brand { margin: -24px -24px 20px; } }
</style>
<script>
try { const t = localStorage.getItem('cp-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<main class="signin">
  <div class="signin-card">
    <div class="signin-brand">
      <img class="logo-light" src="/brand/aramtec-logo.png" alt="Aramtec, a food service company" width="150" height="95">
      <img class="logo-dark" src="/brand/aramtec-logo-white.png" alt="Aramtec, a food service company" width="150" height="95">
      <div class="signin-band">
        <h1>Category Insights &amp; Performance</h1>
        <p class="tagline">Measure results. Find opportunities. Improve performance.</p>
      </div>
    </div>
    <!--ERROR-->
    <form method="post" action="/api/auth/demo">
      <!--CODE-->
      <p class="muted">Demo mode with synthetic data. Choose a demo user:</p>
      <ul>
        <!--USERS-->
      </ul>
    </form>
  </div>
</main>
</body>
</html>
