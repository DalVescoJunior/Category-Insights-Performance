<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Category Insights &amp; Performance</title>
<link rel="icon" href="/brand/aramtec-logo.png">
<style>
/* Design tokens follow Executive Pulse (Management-Cockpit src/app/globals.css): navy brand, green accents,
   blue = actual, red = shortfall, green = over target, amber = watch. Status is never shown by colour alone. */
:root {
  --brand-blue: #2a3879; --brand-blue-50: #eef0f8; --green-light: #80bf44;
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f9fafb; --border: #dfe2e8; --text: #1b1f2a; --text-muted: #5b6070;
  --actual: #2a3879; --short: #b3261e; --over: #166b3b; --pending: #5f6672; --warn: #9a5d00;
  --chip-bg: #eef0f8; --chip-na-bg: #eceef1; --chip-na-text: #555a68; --warn-bg: #fff4dc; --warn-text: #7a4f00;
  --tbl-head-bg: #233066; --tbl-head-text: #ffffff; --tbl-stripe: #f4f6fb; --tbl-hover: #e8edf9;
  --tone-over-bg: #e3f3e9; --tone-over-text: #11663a; --tone-short-bg: #fbe6e4; --tone-short-text: #a8241c; --tone-warn-bg: #fdf1d8; --tone-warn-text: #8a5300;
  --on-brand: #ffffff; --focus: #1a73e8; --radius: 10px;
  --nav-bg: #2a3879; --nav-text: #ffffff; --nav-muted: rgba(255, 255, 255, 0.68); --nav-hover: rgba(255, 255, 255, 0.10); --nav-active-bg: #ffffff; --nav-active-text: #2a3879; --nav-rule: rgba(255, 255, 255, 0.16);
  --heat-up: #166b3b; --heat-down: #b3261e; --bridge-up: #3c8c6e; --bridge-down: #c0473f; --weekend: #eef0f5;
  --bar-remain: #e3e6ee; --bar-future: #c9cdd6; --pace: #2b2f38; --on-bar: #ffffff;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
  /* names the chart code reads */
  --color-panel: var(--surface); --color-fg: var(--text); --color-fg-muted: var(--text-muted);
  --cds-series-1: #2a3879; --cds-chart-grid: #eceef3; --cds-chart-axis: #c9cdd6; --cds-chart-reference: #5f6672; --cds-chart-muted: #b9c0d4; --cds-chart-status-critical: #b3261e;
  --cds-surface-popover: #ffffff; --cds-border: var(--border); --cds-shadow-popover: 0 6px 20px rgba(16, 24, 40, .14); --cds-text-secondary: var(--text-muted);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --brand-blue: #9fb0ff; --brand-blue-50: #232a45;
  --bg: #12151c; --surface: #1b1f29; --surface-2: #222734; --border: #323848; --text: #e8eaf0; --text-muted: #a3a9b8;
  --actual: #8ea2ff; --short: #ff8a80; --over: #6fcf8f; --pending: #9aa0aa; --warn: #f2c063;
  --chip-bg: #2a3150; --chip-na-bg: #262a33; --chip-na-text: #9aa0aa; --warn-bg: #3a2e12; --warn-text: #f3cf7a;
  --tbl-head-bg: #2c3762; --tbl-head-text: #f1f3fa; --tbl-stripe: #202534; --tbl-hover: #2a3043;
  --tone-over-bg: rgba(111, 207, 143, 0.14); --tone-over-text: #7fdc9e; --tone-short-bg: rgba(255, 138, 128, 0.14); --tone-short-text: #ff9a90; --tone-warn-bg: rgba(242, 192, 99, 0.14); --tone-warn-text: #f2c063;
  --on-brand: #12151c;
  --nav-bg: #2b3170; --nav-active-bg: rgba(255, 255, 255, 0.20); --nav-active-text: #ffffff;
  --heat-up: #6fcf8f; --heat-down: #ff8a80; --bridge-up: #5cbf94; --bridge-down: #ff8a80; --weekend: #1f2330;
  --bar-remain: #2c3244; --bar-future: #3a4152; --pace: #f1f3fa; --on-bar: #12151c;
  --cds-series-1: #8ea2ff; --cds-chart-grid: #262b38; --cds-chart-axis: #3a4152; --cds-chart-reference: #a3a9b8; --cds-chart-muted: #4b5470; --cds-chart-status-critical: #ff8a80;
  --cds-surface-popover: #222734; --cds-shadow-popover: 0 6px 20px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; }
a { color: var(--brand-blue); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.dash-skeleton { display: inline-block; min-width: 4ch; color: transparent !important; border-radius: 4px; background: color-mix(in srgb, var(--text) 10%, transparent); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--nav-bg) 232px, var(--bg) 232px); }
.sidebar { background: var(--nav-bg); color: var(--nav-text); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar :focus-visible { outline-color: #ffffff; }
.sidebar .logo { padding: 6px 8px 10px; line-height: 0; text-align: center; }
.sidebar .logo img { width: 150px; height: auto; }
.app-name { margin: 0 4px 10px; padding: 0 4px 14px; border-bottom: 1px solid var(--nav-rule); text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; line-height: 1.5; text-transform: uppercase; color: var(--nav-muted); }
.nav-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--nav-text); text-decoration: none; font-size: 14.5px; font-weight: 600; }
.nav-link:hover { background: var(--nav-hover); }
.nav-link[aria-current="page"] { background: var(--nav-active-bg); color: var(--nav-active-text); }
.nav-count { font-size: 11px; font-weight: 700; color: #fff; background: #c0392b; border-radius: 999px; padding: 1px 7px; }
.nav-section { margin-top: 14px; padding: 0 10px 2px; font-size: 11.5px; color: var(--nav-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.nav-user { padding: 6px 10px 2px; font-weight: 600; }
.nav-role { padding: 0 10px 6px; font-size: 12px; color: var(--nav-muted); }
.main { min-width: 0; padding: 20px 28px 40px; }
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.topbar h1 { font-size: 26px; margin: 0; margin-right: auto; color: var(--text); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.badge-demo { background: var(--warn-bg); color: var(--warn-text); }
.asof { font-size: 13px; color: var(--text-muted); }
.btn { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--brand-blue); border-color: var(--brand-blue); color: var(--on-brand); }
.btn-primary:hover { background: var(--brand-blue); filter: brightness(1.1); }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; }
.seg .btn:first-child { border-radius: 6px 0 0 6px; }
.seg .btn:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
.seg .btn[aria-pressed="true"] { background: var(--brand-blue); border-color: var(--brand-blue); color: var(--on-brand); }

.filterbar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-muted); min-width: 0; }
.field select { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; min-width: 11rem; max-width: 100%; }
.field select:disabled { background: var(--chip-na-bg); color: var(--chip-na-text); }
.filterbar .spacer { margin-left: auto; }
.context-line { font-size: 13px; color: var(--text-muted); margin: 12px 0 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -8px 0 14px; }
.chip-f { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--chip-bg); font-size: 12px; }
.chip-f button { font: inherit; border: 0; background: none; color: var(--brand-blue); cursor: pointer; padding: 0 6px; border-radius: 999px; }

/* Narrow screens: navigation on top, as in Executive Pulse */
@media (max-width: 860px), (orientation: landscape) and (max-height: 500px) {
  .app { grid-template-columns: minmax(0, 1fr); background: var(--bg); }
  .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 12px 16px; }
  .sidebar .logo { padding: 0 6px 6px; text-align: left; }
  .sidebar .logo img { width: 96px; }
  .app-name { flex: 1 1 auto; align-self: center; border: 0; margin: 0; padding: 0 0 6px 8px; text-align: left; font-size: 11px; }
  .nav-section, .nav-user, .nav-role { display: none; }
  .nav-break { flex-basis: 100%; height: 0; }
  .nav-link { font-size: 14px; padding: 6px 10px; }
  .main { padding: 16px; }
  .topbar h1 { font-size: 21px; flex-basis: 100%; }
  .field { flex: 1 1 9rem; }
  .field select { min-width: 0; width: 100%; }
}
@media print {
  .sidebar, .filterbar, .topbar .btn, .topbar .seg { display: none !important; }
  .app { display: block; }
  .cc-scroll { max-height: none !important; overflow: visible !important; }
}

/* ---------- page content (cc-* classes are drawn by the script) ---------- */
.cc { display: flex; flex-direction: column; gap: 16px; }
.cc-page { display: flex; flex-direction: column; gap: 16px; }
.cc-takeaway { margin: 0; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--green-light); border-radius: var(--radius); line-height: 1.5; box-shadow: var(--shadow); }
.cc-takeaway b { font-weight: 650; color: var(--brand-blue); }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--border); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.kpi-actual { border-top-color: var(--actual); }
.kpi-short { border-top-color: var(--short); }
.kpi-over { border-top-color: var(--over); }
.kpi-warn { border-top-color: var(--warn); }
.kpi-label { font-size: 14px; color: var(--text-muted); }
.kpi-value { font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kpi-icon { font-size: 15px; vertical-align: 4px; margin-right: 6px; }
.kpi-actual .kpi-icon { color: var(--actual); }
.kpi-short .kpi-icon { color: var(--short); }
.kpi-over .kpi-icon { color: var(--over); }
.kpi-warn .kpi-icon { color: var(--warn); }
.kpi-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; line-height: 1.35; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 14px; padding: 0; margin: 0; font-size: 12px; color: var(--text-muted); }
.legend .i-actual { color: var(--actual); } .legend .i-short { color: var(--short); } .legend .i-over { color: var(--over); } .legend .i-warn { color: var(--warn); }

.cc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 40rem), 1fr)); gap: 16px; align-items: start; }
.cc-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; box-shadow: var(--shadow); }
.cc-card-wide { grid-column: 1 / -1; }
.cc-card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.cc-card h2 { margin: 0; font-size: 17px; font-weight: 650; }
.cc-note { margin: 0; font-size: 12.5px; color: var(--text-muted); line-height: 1.45; }
.cc-link { font: inherit; font-size: 13px; background: none; border: 0; padding: 0; color: var(--brand-blue); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.cc-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-muted); }
.cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cc-sw { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
.cc-sw-dash { border-top-style: dashed; }
.cc-sw-box { width: 10px; height: 10px; border: 0; border-radius: 2px; }
.cc-chart { position: relative; width: 100%; min-height: 240px; }
.cc-chart svg { display: block; overflow: visible; }
.cc-chart text { fill: var(--text-muted); font-size: 12px; font-family: inherit; }
.cc-tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--cds-shadow-popover); padding: 4px 8px; font-size: 12px; white-space: nowrap; z-index: 3; font-variant-numeric: tabular-nums; }
.cc-tip .cc-tip-h { color: var(--text-muted); margin-bottom: 2px; }
.cc-tip .cc-tip-r { display: flex; align-items: center; gap: 6px; }

/* Executive tables: navy header, banded rows, centred numbers */
.cc-scroll { overflow: auto; max-height: 34rem; border: 1px solid var(--border); border-radius: 8px; }
.cc-scroll.cc-short { max-height: 24rem; }
.cc-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
.cc-table th { position: sticky; top: 0; z-index: 2; background: var(--tbl-head-bg); color: var(--tbl-head-text); font-size: 12px; font-weight: 600; text-align: left; padding: 0; white-space: nowrap; }
.cc-table th button { font: inherit; color: inherit; background: none; border: 0; padding: 9px 8px; cursor: pointer; width: 100%; text-align: inherit; }
.cc-table th[aria-sort="ascending"] button::after { content: " ↑"; }
.cc-table th[aria-sort="descending"] button::after { content: " ↓"; }
.cc-table th.cc-num, .cc-table td.cc-num { text-align: center; }
.cc-table td { padding: 8px; background: var(--surface); vertical-align: middle; white-space: nowrap; }
.cc-table tbody tr:nth-child(even) > td { background: var(--tbl-stripe); }
.cc-table tbody tr.cc-click { cursor: pointer; }
.cc-table tbody tr:hover > td { background: var(--tbl-hover); }
.cc-table td.cc-wrap { white-space: normal; min-width: 12rem; }
.cc-table td.cc-name { font-weight: 600; }
.cc-exp { font: inherit; font-size: 13px; width: 1.5rem; height: 1.5rem; margin: -2px 4px -2px -4px; padding: 0; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--brand-blue); cursor: pointer; vertical-align: middle; transition: transform .2s; }
.cc-exp[aria-expanded="true"] { transform: rotate(90deg); }
.cc-exp:hover { border-color: var(--brand-blue); }
.cc-table tr.cc-sub > td { font-size: 12.5px; background: var(--brand-blue-50); }
.cc-table tr.cc-sub > td:first-child { padding-left: 2.4rem; color: var(--text-muted); font-weight: 500; }
.cc-muted { color: var(--text-muted); }
.cc-good { color: var(--over); font-weight: 600; }
.cc-warn { color: var(--warn); font-weight: 600; }
.cc-bad { color: var(--short); font-weight: 600; }
.cc-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--chip-na-bg); color: var(--chip-na-text); }
.cc-chip[data-tone="bad"] { background: var(--tone-short-bg); color: var(--tone-short-text); }
.cc-chip[data-tone="bad"]::before { content: "▼"; font-size: 9px; }
.cc-chip[data-tone="warn"] { background: var(--tone-warn-bg); color: var(--tone-warn-text); }
.cc-chip[data-tone="warn"]::before { content: "◆"; font-size: 9px; }
.cc-chip[data-tone="ok"] { background: var(--tone-over-bg); color: var(--tone-over-text); }
.cc-chip[data-tone="ok"]::before { content: "▲"; font-size: 9px; }
.cc-bar { display: inline-grid; grid-template-columns: 4.5rem auto; align-items: center; gap: 6px; }
.cc-bar-track { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text) 10%, transparent); }
.cc-bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--actual); }
.cc-bar-fill[data-tone="bad"] { background: var(--short); }
.cc-bar-fill[data-tone="warn"] { background: var(--warn); }
.cc-bar-fill[data-tone="ok"] { background: var(--over); }
.cc-bar-mark { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--text); }
.cc-band { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--over) 28%, transparent); }
.cc-dot { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--brand-blue); box-shadow: 0 0 0 2px var(--surface); }
.cc-filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cc-pill { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text); cursor: pointer; }
.cc-pill b { font-weight: 700; }
.cc-pill[aria-pressed="true"] { background: var(--brand-blue); border-color: var(--brand-blue); color: var(--on-brand); }
.cc-select, .cc-search { font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
.cc-search { width: min(100%, 18rem); }
.cc-empty { padding: 12px; color: var(--text-muted); font-size: 13px; white-space: normal !important; }
.cc-fail { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 120px; color: var(--text-muted); font-size: 13px; }
.cc-fail::before { content: "▼"; color: var(--short); font-size: 10px; }
.cc-defs { margin: 0; padding-left: 1.1rem; font-size: 13px; color: var(--text-muted); line-height: 1.6; columns: 2 18rem; column-gap: 32px; }
.app-footer { display: flex; align-items: center; gap: 12px; margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 12px; }
/* ---------- performance pages ---------- */
.pf-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.pf-bar .field select, .pf-input { min-width: 10rem; }
.pf-bar select:disabled { opacity: .55; cursor: not-allowed; }
.pf-input { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; }
.pf-compare { font-size: 13px; color: var(--text-muted); padding-bottom: 9px; }
.kpi-row.pf-kpis { grid-template-columns: repeat(auto-fill, minmax(min(100%, 172px), 1fr)); }
.pf-kpis .kpi-value { font-size: 22px; }
.pf-tabs { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.pf-tabs .cc-pill { padding: 3px 10px; font-size: 12.5px; }
.pf-loading { display: flex; align-items: center; justify-content: center; min-height: 120px; color: var(--text-muted); font-size: 13px; }
.cc-scroll.pf-tall { max-height: 40rem; }
.pf-table th button small { display: block; font-size: 10.5px; font-weight: 500; opacity: 0.8; }
.pf-table td.pf-label { white-space: nowrap; min-width: 14rem; }
.pf-table .pf-name { font-weight: 600; }
.pf-table .pf-kid { font-weight: 500; }
.pf-table .pf-sub { margin-left: 8px; font-size: 11.5px; color: var(--text-muted); }
.pf-exp-gap { display: inline-block; width: 1.5rem; margin-right: 4px; }
.pf-strong { font-weight: 650; }
.pf-up { color: var(--over); font-weight: 600; }
.pf-down { color: var(--short); font-weight: 600; }
.cc-table.pf-table tbody tr.pf-l1 > td { background: var(--brand-blue-50); font-size: 12.5px; }
.cc-table.pf-table tbody tr.pf-l2 > td, .cc-table.pf-table tbody tr.pf-l3 > td { background: color-mix(in srgb, var(--brand-blue-50) 55%, var(--surface)); font-size: 12.5px; }
.cc-table.pf-table tbody tr:hover > td { background: var(--tbl-hover); }
.cc-table.pf-table tfoot td { position: sticky; bottom: 0; z-index: 2; background: var(--surface-2); border-top: 2px solid var(--tbl-head-bg); font-weight: 700; padding: 9px 8px; white-space: nowrap; }
.cc-table.pf-table th.pf-sep, .cc-table.pf-table td.pf-sep { border-left: 2px solid var(--border); }
/* first column stays put while a wide matrix scrolls sideways */
.pf-matrix td.pf-label { position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--border); }
.pf-matrix th:first-child { position: sticky; left: 0; z-index: 3; }
.pf-matrix tfoot td.pf-label { z-index: 3; }
.pf-matrix td.cc-num { min-width: 4.2rem; }
.pf-daily td.cc-num { min-width: 3.4rem; padding: 8px 5px; }
.cc-table.pf-table th.pf-wkend { background: color-mix(in srgb, var(--tbl-head-bg) 78%, #000); }
.cc-table.pf-table tbody tr > td.pf-wkend { background-image: linear-gradient(var(--weekend), var(--weekend)); background-blend-mode: multiply; }
/* heat: change against last year, shade plus the arrow or sign in the text so colour is never the only cue */

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
// Minimal stand-in for the dashboard runtime: loads each dataset from /api/data/<id>
(function () {
  const cache = {}; const subs = []; const defaults = { scope: 'All categories', brand: null };
  let params = Object.assign({}, defaults); let queued = false;
  const notify = () => { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; subs.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } }); }); };
  const load = (id, refresh) => {
    cache[id] = Object.assign({ status: 'loading', data: [], columns: [], meta: [] }, cache[id] && cache[id].status === 'ok' ? { status: 'ok', data: cache[id].data, columns: cache[id].columns, refreshing: true } : {});
    // an id may carry parameters, e.g. 'margin_detail?month=2026-09'
    const [base, query] = id.split('?');
    const qs = [query, refresh ? 'refresh=1' : ''].filter(Boolean).join('&');
    fetch('/api/data/' + encodeURIComponent(base) + (qs ? '?' + qs : ''))
      .then((r) => { if (r.status === 401) { location.href = '/signin'; throw new Error('signed out'); } return r.json().then((b) => ({ ok: r.ok, b })); })
      .then(({ ok, b }) => { cache[id] = ok ? { status: 'ok', data: b.rows, columns: b.columns, meta: [], refreshing: false } : { status: 'error', data: [], message: b.error }; notify(); })
      .catch((e) => { cache[id] = { status: 'error', data: [], message: String(e) }; notify(); });
  };
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  window.dash = {
    data(id) { if (!cache[id]) load(id); return cache[id]; },
    onData(fn) { subs.push(fn); fn(); },
    params() { return Object.assign({}, params); },
    setParams(o) { params = Object.assign({}, params, o); notify(); },
    resetParams() { params = Object.assign({}, defaults); notify(); },
    setLink(name) { try { history.replaceState(null, '', '#' + name); } catch (e) {} },
    refresh(id) { load(id, true); },
    notify,
    get colors() { return [css('--cds-series-1'), '#80bf44', '#c27c2c', '#3c8c6e', '#b8487a', '#5b7fbf', '#8a8f3a', '#6b6b6b']; },
  };
  let w = window.innerWidth; window.addEventListener('resize', () => { if (window.innerWidth !== w) { w = window.innerWidth; notify(); } });
})();
</script>
